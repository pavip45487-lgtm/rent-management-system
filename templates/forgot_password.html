{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4>Forgot Password</h4>
      <form method="post">
        {{ form.hidden_tag() }}
        <div class="mb-3">{{ form.email.label }}{{ form.email(class_='form-control') }}</div>
        <div class="mb-3">{{ form.submit(class_='btn btn-primary') }}</div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
